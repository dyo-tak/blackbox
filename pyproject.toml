[project]
name = "blackbox"
version = "0.1.0"
description = "Replay debugger + observability for non-generative AI decisions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.54",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.3.6",
]
mysql = [
    "pymysql>=1.2.3",
]
